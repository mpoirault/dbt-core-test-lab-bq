# Binaries only. Python and the python tools come from uv:
# the interpreter from .python-version, the packages from uv.lock, dbt included.
[tools]
uv = "0.11.28"
terraform = "1.15.8"

[tasks.setup]
description = "One-shot dev setup: python env (dbt included) and git hooks"
run = [
  "uv sync",
  "uv run pre-commit install",
]

[env]
# Shell activation only, .venv/bin goes on PATH on `cd` into the repo.
# uv creates and fills the venv through `mise run setup`, mise never creates it.
_.python.venv = ".venv"
