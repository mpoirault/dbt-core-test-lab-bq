# Binaries (terraform, uv) are pinned in mise.toml. uv manages python from .python-version.

[project]
name = "dbt-core-test-lab-bq"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "dbt-bigquery>=1.11,<1.12",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "dbt-bouncer>=3.7",
  "pre-commit>=4.6,<5",
  "pygments>=2.21,<3", # syntax highlighting in explore pages
  "ruff>=0.15.21,<1",
  "rumdl>=0.2.30",
  "shandy-sqlfmt[jinjafmt]>=0.30,<1",
  "yamlfix>=1.19.1",
]

[tool.rumdl]
# MD013 off, dbt docs and tables exceed any line length.
disable = ["MD013"]

[tool.yamlfix]
# whitelines = 1 keeps one blank line between sections, the default strips them.
line_length = 120
preserve_quotes = true
sequence_style = "block_style"
whitelines = 1
