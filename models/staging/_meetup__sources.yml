version: 2

sources:
  - name: meetup
    schema: meetup_raw
    meta:
      external_location: "GCS"
      partitioned_by: "_PARTITIONTIME"
    tables:
      - name: users
        identifier: users
        description: "Contains all users in the database, including metadata and group memberships."
        columns:
          - name: user_id
            data_type: INT64
            description: "A unique identifier for this user. Note that this identifier has no relation to internal identifiers from meetup.com for privacy reasons."
          
          - name: country
            data_type: STRING
            description: "Country where the user resides."
          
          - name: city
            data_type: STRING
            description: "City where the user resides."
          
          - name: hometown
            data_type: STRING
            description: "Town that the user specified as their home town."
          
          - name: memberships
            data_type: RECORD
            description: "Array of membership objects containing group membership details."
            repeated: true
            fields:
              - name: group_id
                data_type: STRING
                description: "The unique identifier of the group that the user has joined."
              
              - name: joined
                data_type: INT64
                description: "Timestamp of the moment the user joined this group."
        
        meta:
          primary_key: "user_id"

      - name: venues
        identifier: venues
        description: "Contains details about all venues referenced from the events data."
        columns:
          - name: lat
            data_type: FLOAT64
            description: "The latitude of the venue location."
          
          - name: venue_id
            data_type: INT64
            description: "A unique identifier for this venue."
          
          - name: country
            data_type: STRING
            description: "The country where the venue is located."
          
          - name: city
            data_type: STRING
            description: "The city where the venue is located."
          
          - name: lon
            data_type: FLOAT64
            description: "The longitude of the venue location."
          
          - name: name
            data_type: STRING
            description: "The name of the venue."
        
        meta:
          primary_key: "venue_id"

      - name: groups
        identifier: groups
        description: "Contains all Meetup groups, including metadata and associated topics."
        columns:
          - name: lat
            data_type: FLOAT64
            description: "Latitude of the place where the group resides."
          
          - name: name
            data_type: STRING
            description: "Name of the group."
          
          - name: description
            data_type: STRING
            description: "Description of the group."
          
          - name: created
            data_type: INT64
            description: "Timestamp of when the group was created."
          
          - name: link
            data_type: STRING
            description: "Link to the group's homepage."
          
          - name: group_id
            data_type: STRING
            description: "Unique identifier for this group. This is used as a reference in other objects."
          
          - name: lon
            data_type: FLOAT64
            description: "Longitude of the place where the group resides."
          
          - name: city
            data_type: STRING
            description: "Name of the city where the group resides."
          
          - name: topics
            data_type: STRING
            description: "Array of topics that this group discusses or otherwise associates with."
            repeated: true
        
        meta:
          primary_key: "group_id"

      - name: events
        identifier: events
        description: "Contains all Meetup events, including metadata and RSVPs."
        columns:
          - name: venue_id
            data_type: INT64
            description: "Unique identifier of the venue where this event takes place."
          
          - name: time
            data_type: INT64
            description: "The timestamp of when the event will start (or has started)."
          
          - name: status
            data_type: STRING
            description: "The status of the event (e.g., 'past' or 'upcoming')."
          
          - name: duration
            data_type: INT64
            description: "The duration of the event, in seconds."
          
          - name: rsvp_limit
            data_type: INT64
            description: "The maximum number of YES RSVPs that this event will allow."
          
          - name: created
            data_type: INT64
            description: "Timestamp of the moment the event was created by the organiser."
          
          - name: rsvps
            data_type: RECORD
            description: "Array of RSVP objects containing attendance details."
            repeated: true
            fields:
              - name: user_id
                data_type: INT64
                description: "The unique identifier of the user that RSVPed for this event."
              
              - name: response
                data_type: STRING
                description: "Yes or No, the indication of whether this user will attend the event."
              
              - name: when
                data_type: INT64
                description: "Timestamp of the moment the user gave their RSVP."
              
              - name: guests
                data_type: INT64
                description: "If permitted, the number of guests that the user is planning to bring to the event."
          
          - name: group_id
            data_type: STRING
            description: "The unique identifier of the group that organised this event."
          
          - name: name
            data_type: STRING
            description: "The title of the event."
          
          - name: description
            data_type: STRING
            description: "The description of the event."
        
        meta:
          contains_pii: false
          primary_key: "CONCAT(CAST(venue_id AS STRING), CAST(time AS STRING), group_id, name, description)"
          notes: "This table has a composite surrogate key generated from venue_id, time, group_id, name, and description in the models"