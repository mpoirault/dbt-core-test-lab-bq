version: 2

models:
  - name: stg_meetup__users
    description: "Staged user data with cleaned and typed fields. Contains user information and their group memberships."
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: user_id
        description: "Unique identifier for the user"
      - name: country_code
        description: "Cleaned country code where the user resides"
      - name: city_name
        description: "Cleaned city name where the user resides"
      - name: hometown_name
        description: "Cleaned hometown name specified by the user"
      - name: memberships
        description: "Array of structured membership data containing group_id and joined_ts"
      - name: inserted_at_date
        description: "Date when this record was inserted into the warehouse"
      - name: inserted_at_ts
        description: "Timestamp when this record was inserted into the warehouse"
      - name: _extracted_at_ts
        description: "Timestamp when this record was extracted from the source"
  - name: stg_meetup__venues
    description: "Staged venue data with cleaned and typed fields. Contains location and basic venue information."
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: venue_id
        description: "Unique identifier for the venue"
      - name: venue_name
        description: "Cleaned venue name"
      - name: city_name
        description: "Cleaned city name where the venue is located"
      - name: country_code
        description: "Cleaned country code where the venue is located"
      - name: latitude
        description: "Latitude coordinate of the venue, null if 0"
      - name: longitude
        description: "Longitude coordinate of the venue, null if 0"
      - name: inserted_at_date
        description: "Date when this record was inserted into the warehouse"
      - name: inserted_at_ts
        description: "Timestamp when this record was inserted into the warehouse"
      - name: _extracted_at_ts
        description: "Timestamp when this record was extracted from the source"
  - name: stg_meetup__groups
    description: "Staged group data with cleaned and typed fields. Contains group information and associated topics."
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: group_id
        description: "Unique identifier for the group"
      - name: group_name
        description: "Cleaned group name"
      - name: description
        description: "Cleaned group description"
      - name: link
        description: "Cleaned URL to the group's homepage"
      - name: description_length
        description: "Length of the group description in characters"
      - name: has_description
        description: "Boolean flag indicating if the group has a description"
      - name: has_valid_url
        description: "Boolean flag indicating if the group's link is a valid URL"
      - name: topics
        description: "Array of cleaned topic names associated with the group"
      - name: latitude
        description: "Latitude coordinate of the group's location, null if 0"
      - name: longitude
        description: "Longitude coordinate of the group's location, null if 0"
      - name: inserted_at_date
        description: "Date when this record was inserted into the warehouse"
      - name: inserted_at_ts
        description: "Timestamp when this record was inserted into the warehouse"
      - name: _extracted_at_ts
        description: "Timestamp when this record was extracted from the source"
  - name: stg_meetup__events
    description: >
      Staging model for Meetup events data. This model standardizes and enriches
      the raw events data from the source.
    config:
      tags: ['staging', 'meetup', 'events']
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: event_id
        description: Surrogate key generated for the event from venue_id, time, group_id, name, and description
      - name: venue_id
        description: Reference to the venue where the event is held
      - name: group_id
        description: Reference to the group organizing the event
      - name: event_name
        description: Name of the event
      - name: description
        description: Detailed description of the event
      - name: original_status
        description: Original status of the event from the source
      - name: current_status
        description: >
          Current status of the event based on the event time and current time. Possible values:
          - past: Event has already occurred (calculated based on event time)
          - upcoming: Event is scheduled for the future (calculated based on event time)
          - cancelled: Event was cancelled by organizers
          - proposed: Event has been proposed but not confirmed
          - suggested: Event has been suggested to organizers
      - name: description_length
        description: Length of the event description in characters
      - name: has_description
        description: Flag indicating if the event has a description
      - name: duration_minutes
        description: Duration of the event in minutes
      - name: duration_hours
        description: Duration of the event in hours
      - name: rsvp_limit
        description: Maximum number of attendees allowed
      - name: series_number
        description: >
          Sequential number of the event within its series (events with the same name).
          Numbered based on chronological order (event_time_ts).
          NULL for events with unique names.
      - name: rsvps
        description: Array of RSVPs for this event
      - name: event_time_ts
        description: Timestamp when the event is scheduled to occur
      - name: event_created_ts
        description: Timestamp when the event was created
      - name: inserted_at_ts
        description: Timestamp when this record was inserted into the staging table
      - name: inserted_at_date
        description: Date when this record was inserted, used for partitioning
      - name: _extracted_at_ts
        description: Timestamp when this record was extracted from the source