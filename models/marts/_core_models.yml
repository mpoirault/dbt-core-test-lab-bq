version: 2

models:
  - name: dim_users
    description: Dimension table containing user information from Meetup.
    config:
      tags: ['dimension', 'meetup', 'users']
      persist_docs:
        relation: true
        columns: true
    
    columns:
      - name: user_id
        description: Unique identifier for the user
      
      - name: country_code
        description: Country code of the user's location
      
      - name: city_name
        description: City name of the user's location
      
      - name: hometown_name
        description: User's hometown name
      
      - name: memberships
        description: Array of group memberships for this user
      
      - name: record_created_ts
        description: Timestamp when the user record was created
      
      - name: record_created_date
        description: Date when the user record was created, used for partitioning
      
      - name: dbt_updated_at
        description: Timestamp when this record was last updated in the data warehouse

  - name: dim_groups
    description: Dimension table containing group information from Meetup.
    config:
      tags: ['dimension', 'meetup', 'groups']
      persist_docs:
        relation: true
        columns: true
    
    columns:
      - name: group_id
        description: Unique identifier for the group
      
      - name: group_name
        description: Name of the group
      
      - name: description
        description: Detailed description of the group
      
      - name: description_length
        description: Length of the group description in characters
      
      - name: has_description
        description: Flag indicating if the group has a description
      
      - name: link
        description: Web link to the group's page
      
      - name: has_valid_url
        description: Flag indicating if the group has a valid URL
      
      - name: latitude
        description: Latitude coordinate of the group's location
      
      - name: longitude
        description: Longitude coordinate of the group's location
      
      - name: topics
        description: Array of topics associated with this group
      
      - name: topic_count
        description: Number of topics associated with this group
      
      - name: record_created_ts
        description: Timestamp when the group record was created
      
      - name: record_created_date
        description: Date when the group record was created, used for partitioning
      
      - name: dbt_updated_at
        description: Timestamp when this record was last updated in the data warehouse

  - name: dim_events
    description: >
      Dimension table containing event information from Meetup.
      Each record represents a unique event with its attributes.
    config:
      tags: ['dimension', 'meetup', 'events']
      persist_docs:
        relation: true
        columns: true
    
    columns:
      - name: event_id
        description: Surrogate key generated for the event from venue_id, time, group_id, name, and description
      
      - name: venue_id
        description: Reference to the venue where the event is held
      
      - name: group_id
        description: Reference to the group organizing the event
      
      - name: event_name
        description: Name of the event
      
      - name: series_number
        description: >
          Sequential number of the event within its series (events with the same name).
          Numbered based on chronological order (event_time_ts).
          NULL for events with unique names.
      
      - name: description
        description: Detailed description of the event
      
      - name: original_status
        description: >
          Original status of the event at time of extraction. Possible values:
          - past: Event has already occurred (calculated based on event time)
          - upcoming: Event is scheduled for the future (calculated based on event time)
          - cancelled: Event was cancelled by organizers
          - proposed: Event has been proposed but not confirmed
          - suggested: Event has been suggested to organizers

      - name: current_status
        description: >
          Current status of the event based on the event time and current time. Possible values:
          - past: Event has already occurred (calculated based on event time)
          - upcoming: Event is scheduled for the future (calculated based on event time)
          - cancelled: Event was cancelled by organizers
          - proposed: Event has been proposed but not confirmed
          - suggested: Event has been suggested to organizers
        tests:
          - accepted_values:
              values: ['past', 'upcoming', 'proposed', 'cancelled', 'suggested']
      
      - name: duration_minutes
        description: Duration of the event in minutes
      
      - name: duration_hours
        description: Duration of the event in hours
      
      - name: rsvp_limit
        description: Maximum number of attendees allowed
      
      - name: rsvps
        description: Array of RSVPs for this event
      
      - name: event_time_ts
        description: Timestamp when the event is scheduled to occur
      
      - name: event_created_ts
        description: Timestamp when the event was created
      
      - name: record_created_ts
        description: Timestamp when this record was created in the data warehouse
      
      - name: record_created_date
        description: Date when this record was created, used for partitioning
      
      - name: dbt_updated_at
        description: Timestamp when this record was last updated in the data warehouse

  - name: dim_venues
    description: Dimension table containing venue information from Meetup.
    config:
      tags: ['dimension', 'meetup', 'venues']
      persist_docs:
        relation: true
        columns: true
    
    columns:
      - name: venue_id
        description: Unique identifier for the venue
      
      - name: venue_name
        description: Name of the venue
      
      - name: city_name
        description: City where the venue is located
      
      - name: country_code
        description: Country code where the venue is located
      
      - name: latitude
        description: Latitude coordinate of the venue's location
      
      - name: longitude
        description: Longitude coordinate of the venue's location
      
      - name: record_created_ts
        description: Timestamp when the venue record was created
      
      - name: record_created_date
        description: Date when the venue record was created, used for partitioning
      
      - name: dbt_updated_at
        description: Timestamp when this record was last updated in the data warehouse

 