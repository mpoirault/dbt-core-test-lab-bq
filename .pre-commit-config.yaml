---
# Tool provisioning: binaries come from mise.toml, Python tools from pyproject.toml
# (uv-managed). Local hooks run `uv run <tool>` so hooks, editor, and CI all use
# the exact versions resolved in uv.lock.
repos:
  # ── Generic hooks (repo-wide) ───────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-json
      - id: pretty-format-json
        args:
          - --autofix
          - --no-sort-keys
      - id: check-ast
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args:
          - --unsafe
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: \.csv$

  # ── Python / formatting (uv-managed, versions in uv.lock) ──────────────────
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types_or:
          - python
          - pyi
          - jupyter
        require_serial: true
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types_or:
          - python
          - pyi
          - jupyter
        require_serial: true
      - id: yamlfix
        name: yamlfix
        entry: uv run yamlfix
        language: system
        types:
          - yaml
        require_serial: true
      - id: rumdl
        name: rumdl
        # `fmt` (formatter semantics) rather than `check`: fixes what it can
        # without failing on unfixable lint rules (e.g. inline HTML).
        entry: uv run rumdl fmt
        language: system
        types:
          - markdown
        require_serial: true

      # ── dbt (only when dbt/ changes) ──────────────────────────────────────
      - id: sqlfmt
        name: sqlfmt
        entry: uv run sqlfmt
        language: system
        files: ^dbt/
        types_or:
          - sql
          - jinja
        require_serial: true
      - id: dbt-bouncer
        name: dbt-bouncer
        # checks dbt/target/manifest.json against dbt-bouncer.yml (modeling
        # standards); run `dbt parse` if the manifest is stale
        entry: uv run dbt-bouncer
        language: system
        always_run: true
        pass_filenames: false

  # ── Terraform (only when infrastructure/ changes) ───────────────────────────
  - repo: https://github.com/gruntwork-io/pre-commit
    rev: v0.1.30
    hooks:
      - id: terraform-fmt
        files: ^infrastructure/.*\.tf$
      - id: terraform-validate
        files: ^infrastructure/.*\.tf$
  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.3.8
    hooks:
      - id: checkov
        files: ^infrastructure/
        args:
          - --config-file=checkov.yaml
