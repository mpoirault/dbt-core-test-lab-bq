---
name: dbt_core_test_lab_bq
version: 1.0.0
config-version: 2

profile: dbt_core_test_lab_bq

model-paths:
  - "models"
analysis-paths:
  - "analyses"
test-paths:
  - "tests"
seed-paths:
  - "seeds"
macro-paths:
  - "macros"
snapshot-paths:
  - "snapshots"
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# +schema values are stage names, not dataset names.
# The dataset is core_<stage> in prod and <your dataset>_core_<stage> in dev,
# see macros/generate_schema_name.sql.
models:
  dbt_core_test_lab_bq:
    +materialized: view

    staging:
      +schema: staging
      +group: core

    # Subfolders under intermediate and marts are business groups. utilities belongs to core.
    intermediate:
      +schema: intermediate
      finance:
        +group: finance

    marts:
      +schema: marts
      +materialized: table
      core:
        +group: core
      finance:
        +group: finance
      marketing:
        +group: marketing
      utilities:
        +group: core

vars:
  # dbt_date defaults to America/Los_Angeles.
  "dbt_date:time_zone": UTC

seeds:
  dbt_core_test_lab_bq:
    +schema: seeds
    sources:
      +schema: raw
      raw_orders:
        +column_types:
          _ETL_LOADED_AT: timestamp
      raw_payments:
        +column_types:
          _BATCHED_AT: timestamp
