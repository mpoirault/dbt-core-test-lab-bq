---
sources:
  - name: jaffle_shop
    description: >
      Jaffle-shop raw data, loaded as dbt seeds into the shared `core_raw`
      dataset (single raw landing zone, dev and prod read the same raw layer).
    schema: core_raw
    tables:
      - name: raw_customers
        description: One row per customer. Contains personal names (PII).
        columns:
          - name: id
            description: Customer natural key. Unique, required for the snapshot.
            data_tests:
              - unique
              - not_null

      - name: raw_orders
        description: One row per order placed.
        config:
          loaded_at_field: _etl_loaded_at
          freshness:
            warn_after:
              count: 24
              period: hour

      - name: raw_payments
        description: One row per payment attempt against an order.
        config:
          loaded_at_field: _batched_at
          freshness:
            warn_after:
              count: 24
              period: hour
