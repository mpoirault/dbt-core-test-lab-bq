dbt-core-test:
  target: ci
  outputs:
    ci:
      type: bigquery
      method: service-account
      keyfile: '{{ env_var("KEYFILE_LOCATION") }}'      # ← single quotes outside
      project: '{{ env_var("BIGQUERY_PROJECT") }}'
      dataset: '{{ env_var("BIGQUERY_DATASET_CI") }}'
      location: EU
      threads: 4
      timeout_seconds: 600

    prod:
      type: bigquery
      method: service-account
      keyfile: '{{ env_var("KEYFILE_LOCATION") }}'
      project: '{{ env_var("BIGQUERY_PROJECT") }}'
      dataset: '{{ env_var("BIGQUERY_DATASET_PROD") }}'
      location: EU
      threads: 4
      timeout_seconds: 600
