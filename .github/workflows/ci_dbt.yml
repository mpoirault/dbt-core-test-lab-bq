---
# dbt side of PR CI: lint, dbt-bouncer, then a full build into a throwaway dataset.
name: ci_dbt

on:
  pull_request:
    branches:
      - main
    paths:
      - dbt/**
      - dbt-bouncer.yml
      - pyproject.toml
      - uv.lock
      - .github/workflows/ci_dbt.yml
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels the previous run for that PR.
concurrency:
  group: ci-dbt-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  GCP_PROJECT: ${{ vars.GCP_PROJECT }}
  # One dataset per PR. The ci target puts every node in here,
  # see dbt/macros/generate_schema_name.sql.
  DBT_DATASET: dbt_core_pr_${{ github.event.pull_request.number || github.run_id }}

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # dbt-bouncer comments its failures on the PR
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: install the pinned toolchain (mise)
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654  # v4.2.4
        with:
          version: 2026.7.7
      - name: install python, dbt and the dev tools (uv sync)
        run: uv sync
      - name: dbt deps
        working-directory: dbt
        run: uv run dbt deps
      # Same hooks as a local commit. Terraform hooks run in ci_terraform,
      # dbt-bouncer runs as its own step because it needs a manifest first.
      - name: lint (pre-commit)
        run: SKIP=dbt-bouncer,terraform-fmt,terraform-validate,checkov uv run pre-commit run --all-files --show-diff-on-failure
      - name: dbt parse (build the manifest)
        working-directory: dbt
        run: uv run dbt parse --target ci
      - name: dbt-bouncer (modeling standards)
        uses: godatadriven/dbt-bouncer@1c45e86dee870952f36c67371c9a5c0ac4139444  # v3.8.0
        with:
          config-file: ./dbt-bouncer.yml
          only: manifest_checks
          send-pr-comment: ${{ github.event_name == 'pull_request' }}
      # A PR from a fork never gets repository secrets,
      # so the build is skipped there and the PR still gets lint and bouncer.
      - name: authenticate to gcp (dbt-core-ci SA)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_DBT_CI_SA_KEY }}
      # Seeds excluded: staging reads the shared core_raw through source(), same as prod.
      # The snapshot lands in the PR dataset, CI never writes to shared raw.
      #
      # Slim CI would be:
      #   dbt build --target ci -s state:modified+ --defer --favor-state --state <prod manifest>
      # That needs a manifest store with IAM and a download step.
      # More infra than a lab needs, this project builds in under a minute.
      - name: dbt build (full, into the PR dataset)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: dbt
        run: uv run dbt build --target ci --exclude resource_type:seed
      # always(), so a failed build does not leave the dataset behind.
      - name: drop the PR dataset
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: bq rm --recursive --force --dataset "${GCP_PROJECT}:${DBT_DATASET}"
