---
# dbt docs to GitHub Pages. runs after a successful cd_dbt, so the catalog
# matches the tables that exist in prod. the CI service account has read on
# core_*, thats all docs generate needs. no gh-pages branch: the site is
# uploaded as an artifact and deployed from it.
name: cd_dbt_docs

on:
  workflow_run:
    workflows:
      - cd_dbt
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-dbt-docs
  cancel-in-progress: true

env:
  GCP_PROJECT: ${{ vars.GCP_PROJECT }}

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: install the pinned toolchain (mise)
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654  # v4.2.4
        with:
          version: 2026.7.7
      - name: install python and dbt (uv sync)
        run: uv sync
      - name: authenticate to gcp (dbt-core-ci SA, read on core_*)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_DBT_CI_SA_KEY }}
      - name: dbt docs generate (single static page)
        working-directory: dbt
        run: |
          uv run dbt deps
          uv run dbt docs generate --target prod --static
          mkdir -p site
          cp target/static_index.html site/index.html
      - name: upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: dbt/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
