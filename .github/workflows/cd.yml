name: dbt‑cd

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BIGQUERY_KEYFILE_JSON:  ${{ secrets.BIGQUERY_KEYFILE }}
      BIGQUERY_PROJECT:       ${{ secrets.BIGQUERY_PROJECT }}
      BIGQUERY_DATASET_PROD:  ${{ secrets.BIGQUERY_DATASET_PROD }}
      DBT_PROFILES_DIR:       .          # repo root holds profiles.yml

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-bigquery

      - name: Verify connection to BigQuery prod
        run: dbt debug --target prod
