name: dbt CI

on:
  pull_request:
    branches: [ main ]

jobs:
  debug:
    runs-on: ubuntu-latest

    # expose only what dbt needs
    env:
      BIGQUERY_KEYFILE_JSON: ${{ secrets.BIGQUERY_KEYFILE }}   # full SA key as JSON
      BIGQUERY_PROJECT:      ${{ secrets.BIGQUERY_PROJECT }}
      BIGQUERY_DATASET_CI:   ${{ secrets.BIGQUERY_DATASET_CI }}
      DBT_PROFILES_DIR:      .            # directory that holds profiles.yml

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-bigquery

      - name: Test BigQuery connection
        run: dbt debug --target ci
